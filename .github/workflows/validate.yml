name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install chezmoi mise ripgrep shellcheck shfmt
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep shellcheck shfmt zsh
            sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
            curl https://mise.run | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - run: ./scripts/validate.sh
      - run: ./bootstrap.sh --dry-run

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $Files = @("bootstrap.ps1", "packages/windows.ps1", "home/private_Documents/PowerShell/Microsoft.PowerShell_profile.ps1")
          foreach ($File in $Files) {
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $File),
              [ref]$null,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              throw ($Errors | Format-List | Out-String)
            }
          }
      - run: .\bootstrap.ps1 -DryRun
